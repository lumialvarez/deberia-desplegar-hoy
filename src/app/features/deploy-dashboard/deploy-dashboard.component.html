<div class="shell aurora">
  <main class="relative z-10 mx-auto max-w-3xl px-4 sm:px-6 py-12 md:py-20">
    <div class="flex flex-col gap-10 md:gap-14">

      <!-- Page title -->
      <header class="text-center space-y-2 animate-fade-up">
        <p class="text-[11px] font-medium uppercase tracking-[0.4em] text-white/40">
          ¿Debería desplegar hoy?
        </p>
      </header>

      <!-- Hero / decision -->
      <app-status-card />

      <!-- Time -->
      <app-time-display />

      <!-- Location picker -->
      <app-location-picker />

      <!-- Debug (only with ?debug=true) -->
      @if (state().isDebugMode) {
        <app-debug-controls />
      }

      <!-- Footer -->
      <app-dashboard-footer />

    </div>
  </main>
</div>
