server {
    listen 91;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Allow indexing only in production
    # add_header X-Robots-Tag "all" always;

    # Service worker must be served from root with correct headers
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
    }

    # Long cache for hashed static assets (Angular adds hash to filename)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Medium cache for other static assets
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # SPA fallback — Angular Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
